name: Tests

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
      - run: pip install -r requirements.txt
      - run: pytest
      - run: find pico -name '*.py' -print0 | xargs -0 -n1 python -m mpy_cross -march=armv6m -o "$RUNNER_TEMP/check.mpy"
